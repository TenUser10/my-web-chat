<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyChat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Màn hình Đăng nhập -->
    <div id="loginContainer" class="login-container">
        <h2 id="loginTitle">Đăng Nhập MyChat</h2>
        <p id="loginSubtitle" style="margin-top: 8px; color: #666;">Vui lòng đăng nhập để bắt đầu trò chuyện</p>
        <button id="googleLoginBtn" class="google-btn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
            <span id="loginBtnText">Đăng nhập bằng Google</span>
        </button>
    </div>

    <!-- Khung Chat chính -->
    <div id="chatContainer" class="chat-container" style="display: none;">
        <!-- Thanh tiêu đề Header -->
        <div class="chat-header">
            <h2>MyChat</h2>
            <div class="user-info">
                <span id="userDisplayName"></span>
                <!-- Bảng chọn ngôn ngữ (Mặc định Tiếng Anh) -->
                <select id="langSelector" class="lang-selector">
                    <option value="en" selected>English</option>
                    <option value="vi">Tiếng Việt</option>
                </select>
                <!-- Nút bật thông báo chủ động -->
                <button id="enableNotifBtn" class="notif-btn" title="Enable notifications">🔔 Turn on Notifications</button>
                <button id="logoutBtn" class="logout-btn">Logout</button>
            </div>
        </div>

        <!-- Khu vực hiển thị tin nhắn -->
        <div class="chat-box" id="chatBox"></div>

        <!-- Thanh nhập tin nhắn & Gửi ảnh -->
        <div class="chat-input-area">
            <!-- Nút đính kèm hình ảnh 📷 -->
            <label for="imageInput" class="image-upload-btn" title="Send image">📷</label>
            <input type="file" id="imageInput" accept="image/*" style="display: none;">
            
            <!-- Ô nhập nội dung tin nhắn -->
            <input type="text" id="messageInput" placeholder="Type a message..." class="input-msg">
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <!-- Script chính -->
    <script type="module" src="app.js"></script>
</body>
</html>
