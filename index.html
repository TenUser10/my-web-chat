<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyChat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Màn hình Đăng nhập -->
    <div id="loginContainer" class="login-container">
        <h2 id="loginTitle">Sign in to MyChat</h2>
        <p id="loginSubtitle" style="margin-top: 8px; color: #666;">Please sign in to start chatting</p>
        <button id="googleLoginBtn" class="google-btn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
            <span id="loginBtnText">Sign in with Google</span>
        </button>
    </div>

    <!-- Khung Chat chính -->
    <div id="chatContainer" class="chat-container" style="display: none;">
        <!-- Thanh tiêu đề Header -->
        <div class="chat-header">
            <h2>MyChat</h2>
            <div class="user-info">
                <span id="userDisplayName"></span>
                <button id="openProfileBtn" class="profile-btn" title="Edit Profile">⚙️</button>
                <select id="langSelector" class="lang-selector">
                    <option value="en" selected>English</option>
                    <option value="vi">Tiếng Việt</option>
                </select>
                <button id="enableNotifBtn" class="notif-btn" title="Enable notifications">🔔 Turn on</button>
                <button id="logoutBtn" class="logout-btn">Logout</button>
            </div>
        </div>

        <!-- Thanh chuyển đổi phòng chat -->
        <div class="room-tabs">
            <button id="tabFamily" class="room-tab active">🏠 Family Chat</button>
            <button id="tabGame" class="room-tab">🎮 Game Chat</button>
        </div>

        <!-- Khu vực hiển thị tin nhắn -->
        <div class="chat-box" id="chatBox"></div>

        <!-- Thanh nhập tin nhắn & Gửi ảnh -->
        <div class="chat-input-area">
            <label for="imageInput" class="image-upload-btn" title="Send image">📷</label>
            <input type="file" id="imageInput" accept="image/*" style="display: none;">
            
            <input type="text" id="messageInput" placeholder="Type a message..." class="input-msg">
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <!-- Modal Đổi Tên & Avatar -->
    <div id="profileModal" class="modal" style="display: none;">
        <div class="modal-content">
            <h3 id="modalTitle">Edit Profile</h3>
            <div class="profile-preview-container">
                <img id="previewAvatar" src="" alt="Avatar Preview" class="modal-avatar-preview">
            </div>
            
            <label id="labelName" class="modal-label">Display Name:</label>
            <input type="text" id="inputNewName" class="modal-input" placeholder="Enter new name...">

            <label id="labelAvatar" class="modal-label">Avatar Image (Upload or URL):</label>
            <input type="file" id="inputNewAvatarFile" accept="image/*" class="modal-file-input">
            <input type="text" id="inputNewAvatarUrl" class="modal-input" placeholder="Or paste image URL here...">

            <div class="modal-buttons">
                <button id="saveProfileBtn" class="modal-save-btn">Save</button>
                <button id="closeModalBtn" class="modal-close-btn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Script chính -->
    <script type="module" src="app.js"></script>
</body>
</html>
